apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: bidpoint/config-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
